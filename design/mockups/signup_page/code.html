<!DOCTYPE html>

<html class="h-full bg-white" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Sign Up - Serendib</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          serif: ['"Newsreader"', 'Georgia', 'serif'],
        },
        boxShadow: {
          '2xs': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
        }
      }
    }
  }
</script>
<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
</head>
<body class="h-full w-full bg-white text-slate-900 select-none">
<!-- Global Wrapper -->
<div class="relative h-screen w-full bg-white overflow-hidden flex flex-col font-sans antialiased">
<!-- Native iPhone Status Bar with Dynamic Island -->
<div class="z-30 relative shrink-0 pt-3 px-7 flex justify-between items-center text-xs font-semibold text-slate-800" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[14px] font-semibold tracking-tight w-12 text-left text-slate-900">9:41</span>
<!-- Dynamic Island Pill -->
<div class="w-[110px] h-[30px] bg-black rounded-full flex items-center justify-end px-3 gap-2 mx-auto">
<div class="w-2.5 h-2.5 rounded-full bg-slate-900/90 border border-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-emerald-950/40"></div>
</div>
<!-- Status Icons (Signal, Wifi, Battery) -->
<div class="flex items-center gap-1.5 w-12 justify-end text-slate-900">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M2 19h3v-3H2v3zm5 0h3v-7H7v7zm5 0h3v-11h-3v11zm5 0h3v-15h-3v15z"></path>
</svg>
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.25c3.78 0 7.22 1.48 9.77 3.9L12 18.9 2.23 11.15C4.78 8.73 8.22 7.25 12 7.25z"></path>
</svg>
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto relative z-10 px-6 pt-6 pb-48 max-w-md mx-auto w-full no-scrollbar" data-purpose="scrollable-screen-content">
<!-- Top Branding / Logo -->
<div class="flex items-center justify-center gap-2 mb-4" data-purpose="brand-header">
<div class="w-7 h-7 rounded-lg bg-emerald-700 flex items-center justify-center text-white shadow-xs">
<span class="material-symbols-outlined text-[17px]">eco</span>
</div>
<span class="text-sm font-semibold tracking-tight text-slate-800 font-sans">Serendib</span>
</div>
<!-- Heading & Subtitle -->
<div class="text-center">
<h1 class="text-[32px] leading-tight font-serif font-normal text-slate-900 tracking-tight text-center">Create a Serendib account</h1>
<p class="text-sm text-slate-500 mt-1.5 font-normal text-center mb-6">Your debt-free journey starts here</p>
</div>
<!-- Social Authentication Row -->
<section aria-label="Social sign up options" class="w-full mb-6">
<div class="grid grid-cols-3 gap-3">
<!-- X (Twitter) -->
<button aria-label="Sign up with X" class="h-11 bg-white border border-slate-200 hover:border-slate-300 rounded-xl flex items-center justify-center transition-all shadow-xs active:scale-95 group" type="button">
<svg class="w-4 h-4 text-slate-900 group-hover:scale-105 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
</svg>
</button>
<!-- Apple -->
<button aria-label="Sign up with Apple" class="h-11 bg-white border border-slate-200 hover:border-slate-300 rounded-xl flex items-center justify-center transition-all shadow-xs active:scale-95 group" type="button">
<svg class="w-4 h-4 text-slate-900 group-hover:scale-105 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.93.04-2.02.63-2.67 1.38-.56.64-1.06 1.71-.92 2.74 1.04.08 2.06-.5 2.67-1.25z"></path>
</svg>
</button>
<!-- Google -->
<button aria-label="Sign up with Google" class="h-11 bg-white border border-slate-200 hover:border-slate-300 rounded-xl flex items-center justify-center transition-all shadow-xs active:scale-95 group" type="button">
<svg class="w-4 h-4 shrink-0 group-hover:scale-105 transition-transform" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
</button>
</div>
<!-- Divider -->
<div class="flex items-center my-4">
<div class="border-t border-slate-200/80 flex-grow"></div>
<span class="text-[11px] text-slate-400 mx-3 font-normal">or</span>
<div class="border-t border-slate-200/80 flex-grow"></div>
</div>
</section>
<!-- Sign Up Form Stack -->
<form class="space-y-4" data-purpose="signup-fields" onsubmit="event.preventDefault();">
<!-- 1. First Name -->
<div>
<label class="text-xs font-medium text-slate-500 mb-1.5 block" for="first-name">First Name</label>
<input class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-slate-400 focus:ring-0 transition-colors" id="first-name" placeholder="Seniru" type="text"/>
</div>
<!-- 2. Middle Name (Optional) -->
<div>
<label class="text-xs font-medium text-slate-500 mb-1.5 block" for="middle-name">Middle Name - Optional</label>
<input class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-slate-400 focus:ring-0 transition-colors" id="middle-name" placeholder="Minthaka" type="text"/>
</div>
<!-- 3. Last Name -->
<div>
<label class="text-xs font-medium text-slate-500 mb-1.5 block" for="last-name">Last Name</label>
<input class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-slate-400 focus:ring-0 transition-colors" id="last-name" placeholder="Meegahawaththe" type="text"/>
</div>
<!-- 4. Email address -->
<div>
<label class="text-xs font-medium text-slate-500 mb-1.5 block" for="email">Email address</label>
<input autocomplete="email" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-slate-400 focus:ring-0 transition-colors" id="email" placeholder="name@example.com" type="email"/>
</div>
<!-- 5. Password -->
<div>
<label class="text-xs font-medium text-slate-500 mb-1.5 block" for="password">Password</label>
<div class="relative flex items-center">
<input class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 pr-11 text-sm focus:border-slate-400 focus:ring-0 transition-colors" id="password" placeholder="Create a password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 p-1 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none" id="togglePassword" onclick="
              const pwd = document.getElementById('password');
              const eyeOpen = document.getElementById('eyeIconOpen');
              const eyeClosed = document.getElementById('eyeIconClosed');
              if (pwd.type === 'password') {
                pwd.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
              } else {
                pwd.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
              }
            " type="button">
<svg class="w-4 h-4" fill="none" id="eyeIconOpen" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<svg class="w-4 h-4 hidden" fill="none" id="eyeIconClosed" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- 6. Confirm Password -->
<div>
<label class="text-xs font-medium text-slate-500 mb-1.5 block" for="confirm-password">Confirm Password</label>
<div class="relative flex items-center">
<input class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 pr-11 text-sm focus:border-slate-400 focus:ring-0 transition-colors" id="confirm-password" placeholder="Confirm your password" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-3 p-1 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none" id="toggleConfirmPassword" onclick="
              const pwd = document.getElementById('confirm-password');
              const eyeOpen = document.getElementById('eyeConfirmOpen');
              const eyeClosed = document.getElementById('eyeConfirmClosed');
              if (pwd.type === 'password') {
                pwd.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
              } else {
                pwd.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
              }
            " type="button">
<svg class="w-4 h-4" fill="none" id="eyeConfirmOpen" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<svg class="w-4 h-4 hidden" fill="none" id="eyeConfirmClosed" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Call to Action Submit Button -->
<button class="bg-[#1a1f2e] text-white font-semibold rounded-xl py-3.5 w-full hover:bg-slate-800 transition-all active:scale-[0.98] shadow-sm flex items-center justify-center cursor-pointer mt-2" type="submit">
        Create Account
      </button>
<!-- Footer Link -->
<p class="text-xs text-slate-500 mt-4 text-center">
        Already have an account? <a class="font-bold text-slate-900 hover:text-emerald-700 transition-colors ml-0.5 cursor-pointer" href="#login">Log in</a>
</p>
</form>
</div>
<!-- Fixed Watercolor Landscape Container -->
<div class="absolute bottom-0 left-0 w-full z-0 pointer-events-none overflow-hidden h-[260px]" data-purpose="landscape-illustration-container">
<!-- Top white gradient dissolve overlay -->
<div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-white via-white/85 to-transparent z-10"></div>
<!-- Soft ambient blurred glow orbs -->
<div class="absolute -top-6 left-1/4 w-40 h-40 bg-emerald-100/50 rounded-full blur-2xl z-0"></div>
<div class="absolute top-2 right-1/4 w-36 h-36 bg-teal-50/70 rounded-full blur-2xl z-0"></div>
<!-- The watercolor image -->
<img alt="Lush green Sri Lankan tea plantation landscape with savings sprout and piggy bank" class="w-full h-full object-cover object-bottom" src="https://lh3.googleusercontent.com/aida/AEtjO1WeOp9CoOUN_dOoMcLXNFU9pKnGvD09QPU5gyzWrF-g9SoyFJnoJGHbzb9bOg8PbOX49fGCnxbfkqyieK--FD31i0neMDStCZYzS0jgxyg-ne_JpeFDu10-IBbLt2O1HUW7rpEIuyXDMs9g0tKrNWEvJ6Obemvxw_wD85Dx3RU6qQYjrFCt-pF-NApho8VeRLazl-qejf4sa4LyENr47tdyl0DsYCvENx0NgAAdVBsW"/>
<!-- Floating CBSL badge -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-white/80 shadow-lg shadow-emerald-950/5 animate-pulse">
<span class="w-2 h-2 rounded-full bg-emerald-500"></span>
<span class="text-[11px] font-semibold text-slate-800 tracking-tight">CBSL Regulated Protection</span>
</div>
<!-- Native iOS Home Indicator bar -->
<div class="absolute bottom-2 inset-x-0 flex justify-center z-30">
<div class="w-32 h-1 bg-slate-400/60 rounded-full"></div>
</div>
</div>
</div>
</body></html>
