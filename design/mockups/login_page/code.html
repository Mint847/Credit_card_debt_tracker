<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Serendib - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Newsreader"', 'serif'],
          },
          animation: {
            'ambient-breathe': 'breathe 8s ease-in-out infinite',
          },
          keyframes: {
            breathe: {
              '0%, 100%': { transform: 'scale(1) translateY(0)' },
              '50%': { transform: 'scale(1.03) translateY(-4px)' },
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen sm:p-4">
<!-- iPhone Form Factor Wrapper -->
<main class="w-full max-w-[393px] min-h-[852px] bg-white flex flex-col justify-between relative overflow-hidden sm:rounded-[44px] sm:shadow-2xl sm:ring-1 sm:ring-slate-900/5">
<!-- Top Area: Status Bar & Main Content -->
<div class="relative z-10 flex flex-col flex-1">
<!-- Native iPhone Status Bar with Dynamic Island -->
<div class="pt-3 px-7 flex items-center justify-between text-slate-900 select-none z-30">
<!-- Time -->
<span class="text-[14px] font-semibold tracking-tight w-12 text-left">9:41</span>
<!-- Dynamic Island Pill -->
<div class="w-[110px] h-[30px] bg-black rounded-full flex items-center justify-end px-3 gap-2 mx-auto">
<div class="w-2.5 h-2.5 rounded-full bg-slate-900/90 border border-slate-800"></div>
<div class="w-2.5 h-2.5 rounded-full bg-emerald-950/40"></div>
</div>
<!-- Status Icons (Signal, Wifi, Battery) -->
<div class="flex items-center gap-1.5 w-12 justify-end">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M2 19h3v-3H2v3zm5 0h3v-7H7v7zm5 0h3v-11h-3v11zm5 0h3v-15h-3v15z"></path>
</svg>
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.25c3.78 0 7.22 1.48 9.77 3.9L12 18.9 2.23 11.15C4.78 8.73 8.22 7.25 12 7.25z"></path>
</svg>
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- Header & Branding -->
<div class="pt-7 pb-4 px-6 text-center">
<!-- Brand Logo -->
<div class="inline-flex items-center justify-center gap-2 mb-4">
<div class="w-7 h-7 rounded-lg bg-emerald-700 flex items-center justify-center text-white shadow-xs">
<span class="material-symbols-outlined text-[17px]">eco</span>
</div>
<span class="text-sm font-semibold tracking-tight text-slate-800 font-sans">Serendib</span>
</div>
<!-- Editorial Serif Title matching reference -->
<h1 class="font-serif text-[28px] leading-tight text-slate-900 font-normal tracking-tight">Log in to Serendib</h1>
<p class="text-xs text-slate-500 mt-1.5 font-normal tracking-normal">Your debt-free journey starts here</p>
</div>
<!-- Social Logins Row (3 Cards: X, Apple, Google) -->
<div class="px-6 pt-2">
<div class="grid grid-cols-3 gap-3">
<!-- X (Twitter) -->
<button aria-label="Sign in with X" class="h-11 bg-white border border-slate-200 hover:border-slate-300 rounded-xl flex items-center justify-center transition-all shadow-xs active:scale-95 group" type="button">
<svg class="w-4 h-4 text-slate-900 group-hover:scale-105 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
</svg>
</button>
<!-- Apple -->
<button aria-label="Sign in with Apple" class="h-11 bg-white border border-slate-200 hover:border-slate-300 rounded-xl flex items-center justify-center transition-all shadow-xs active:scale-95 group" type="button">
<svg class="w-4 h-4 text-slate-900 group-hover:scale-105 transition-transform" fill="currentColor" viewbox="0 0 24 24">
<path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.93.04-2.02.63-2.67 1.38-.56.64-1.06 1.71-.92 2.74 1.04.08 2.06-.5 2.67-1.25z"></path>
</svg>
</button>
<!-- Google -->
<button aria-label="Sign in with Google" class="h-11 bg-white border border-slate-200 hover:border-slate-300 rounded-xl flex items-center justify-center transition-all shadow-xs active:scale-95 group" type="button">
<svg class="w-4 h-4 shrink-0 group-hover:scale-105 transition-transform" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
</button>
</div>
<!-- Subtle "or" Divider -->
<div class="flex items-center my-4">
<div class="border-t border-slate-200/80 flex-grow"></div>
<span class="text-[11px] text-slate-400 mx-3 font-normal">or</span>
<div class="border-t border-slate-200/80 flex-grow"></div>
</div>
</div>
<!-- Input Form -->
<form class="px-6 flex flex-col gap-3.5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div>
<label class="block text-xs text-slate-600 mb-1.5 font-medium" for="email">Email address</label>
<input autocomplete="email" class="w-full bg-white border border-slate-200 text-slate-900 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all shadow-2xs placeholder:text-slate-400" id="email" placeholder="" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-xs text-slate-600 font-medium" for="password">Password</label>
<a class="text-[11px] text-slate-400 hover:text-slate-600 transition-colors" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full bg-white border border-slate-200 text-slate-900 text-sm rounded-xl px-3.5 py-2.5 pr-10 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all shadow-2xs placeholder:text-slate-400" id="password" placeholder="" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 flex items-center justify-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none" id="togglePassword" onclick="
                const pwd = document.getElementById('password');
                const eyeOpen = document.getElementById('eyeIconOpen');
                const eyeClosed = document.getElementById('eyeIconClosed');
                if (pwd.type === 'password') {
                  pwd.type = 'text';
                  eyeOpen.classList.add('hidden');
                  eyeClosed.classList.remove('hidden');
                } else {
                  pwd.type = 'password';
                  eyeOpen.classList.remove('hidden');
                  eyeClosed.classList.add('hidden');
                }
              " type="button">
<svg class="w-4 h-4" fill="none" id="eyeIconOpen" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<svg class="w-4 h-4 hidden" fill="none" id="eyeIconClosed" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Continue with Email Button (Black Charcoal / Reference Style) -->
<button class="w-full mt-2 py-3 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl active:scale-98 transition-all text-sm shadow-xs flex items-center justify-center" type="submit">
<span>Continue with Email</span>
</button>
</form>
<!-- Routing Footer -->
<div class="mt-4 text-center">
<p class="text-xs text-slate-500 font-medium">
          Don't have an account? 
          <a class="font-semibold text-slate-900 hover:text-emerald-700 transition-colors" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Bottom Illustration Section (Dissolves seamlessly into white top) -->
<div class="relative w-full h-[250px] overflow-hidden mt-auto select-none pointer-events-none">
<!-- Top Seamless Gradient Fade (dissolves into pure white card background above) -->
<div class="absolute inset-x-0 top-0 h-28 bg-gradient-to-b from-white via-white/80 to-transparent z-10"></div>
<!-- Ambient Floating Illustration Container -->
<div class="w-full h-full animate-ambient-breathe origin-bottom">
<img alt="Serene Sri Lankan tea hills and financial growth illustration" class="w-full h-full object-cover object-bottom" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgLHJqPGhsPY-vh5kSrCXVcO_qKSGFoN2ymZG3wrR3yGvWIRxewJaF9i9n4EnT3HQoDQi8_jxEBtJQnQpaaBadaeE4wv8JWsPaElQciIkyOFP_mWE0Dx6vxv_cNhEI1oKi4uNYFd3QVbfBHmbZnH0IH5veMEKOtGhGeBbSdu1iL3YMYjHzQADV4Mup1AnucWJjdmJ4hqFOthdXzVBRcI_826MIRZdR-K9oI2JDCj7X"/>
</div>
<!-- Subtle Vignette / Edge Softening -->
<div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-emerald-950/5 to-transparent"></div>
<!-- Native iPhone Home Indicator Bar -->
<div class="absolute bottom-2 inset-x-0 z-20 flex justify-center">
<div class="w-32 h-1 bg-slate-800/40 rounded-full backdrop-blur-xs"></div>
</div>
</div>
</main>
</body></html>
