name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit IDs, as in the offers collector workflow
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core tests
        run: npm run test:core
      - name: Core copy in web/index.html is up to date
        run: |
          npm run build:core
          git diff --exit-code -- web/index.html || {
            echo "::error::web/index.html is out of date. Run 'npm run build:core' and commit the result."
            exit 1
          }
      - name: Build the app (type-check and bundle)
        run: npm run build:desktop
