name: Weekly offers collector

on:
  schedule:
    # Sunday 20:30 UTC = Monday 02:00 Sri Lanka time
    - cron: '30 20 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: extract and print offers without writing to Firestore'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/offers-collector
    steps:
      # Actions pinned to commit IDs (a moved tag can't change what runs next to the secrets)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Install dependencies
        # Exactly the versions in package-lock.json: this job holds the Firestore admin key
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium (for pages that need a browser)
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Collect offers
        run: node collect.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OFFERS_MODEL: ${{ vars.OFFERS_MODEL }}
